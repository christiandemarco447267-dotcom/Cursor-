name: Deploy to GitHub Pages

on:
  push:
    branches:
      - cursor/ainvestpro-stable-rebuild-5ca3
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        # Best-effort auto-enable. Works once the repo is public (the token can
        # then create the Pages site); harmless no-op otherwise thanks to
        # continue-on-error, in which case Pages must be enabled once in Settings.
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Prepare static export
        # API routes and the proxy require a server and are unsupported by
        # `output: export`. The app is local-first, so a static build is fully
        # functional (client-side demo market data). Strip them for this build only.
        run: |
          rm -rf src/app/api
          rm -f src/proxy.ts

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: "/${{ github.event.repository.name }}"
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
