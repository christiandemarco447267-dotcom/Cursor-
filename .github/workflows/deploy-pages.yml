name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        id: pages
        # Best-effort auto-enable. Works once the repo is public (the token can
        # then create the Pages site); harmless no-op otherwise thanks to
        # continue-on-error, in which case Pages must be enabled once in Settings.
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Prepare static export
        # API routes and the proxy require a server and are unsupported by
        # `output: export`. The app is local-first, so a static build is fully
        # functional; real prices, feedback and the AI coach come from the optional
        # Sentia API (worker/). Strip the server-only files for this build only.
        run: |
          rm -rf src/app/api
          rm -f src/proxy.ts

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          # Base path comes from the Pages config when available (handles custom domains,
          # where it is empty), else the repository name — e.g. "/Cursor-". Never hardcoded.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}
          # Base path for absolute asset URLs (favicon, logo) that Next doesn't auto-prefix.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}
          # Canonical URL for metadata/OG/sitemap/robots. If configure-pages didn't run,
          # src/lib/site.ts derives it from GITHUB_REPOSITORY_OWNER + PAGES_BASE_PATH.
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Tells the client it's a static build (skip the non-existent /api route).
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          # Optional: URL of the Sentia API (the Cloudflare Worker in /worker), e.g.
          # https://sentia-api.<you>.workers.dev. Set it as a repository VARIABLE (Settings →
          # Secrets and variables → Actions → Variables), not a secret: it's a public URL.
          # Market-data and AI keys live only in the Worker as Worker secrets and are never
          # put in this build. Leave unset and the site runs with demo prices, the built-in
          # coach, link-based feedback and no analytics.
          NEXT_PUBLIC_SENTIA_API_URL: ${{ vars.NEXT_PUBLIC_SENTIA_API_URL }}
          # Optional public contact email for the no-API feedback fallback (repository variable).
          NEXT_PUBLIC_FEEDBACK_EMAIL: ${{ vars.NEXT_PUBLIC_FEEDBACK_EMAIL }}
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
